name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: swift build -c release --product cofre-selftest && .build/release/cofre-selftest
      - name: Build
        run: ./build.sh
      - name: Package
        run: |
          ./scripts/make-dmg.sh
          cd build
          ditto -c -k --keepParent Cofre.app Cofre.zip
          shasum -a 256 Cofre.zip > Cofre.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Cofre.dmg build/Cofre.dmg.sha256 build/Cofre.zip build/Cofre.zip.sha256 \
            --title "Cofre $GITHUB_REF_NAME" --generate-notes
