name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (round trip, tampering, benchmark)
        run: swift build -c release --product cofre-selftest && .build/release/cofre-selftest
      - name: Build Cofre.app
        run: ./build.sh
